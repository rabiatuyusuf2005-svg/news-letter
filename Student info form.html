<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
    <link rel="stylesheet" href="SIF.css">
    <link rel="icon" type="Dog.jpg" href="Dog.jpg">
</head>
<body>

<div class="container">
    <h1>IDEAS</h1>
    <h2>Student Information Form</h2>

    <form id="studentForm">

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <label for="gender">Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>

        </select>

        <label for="course">Course/Program</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option>Computer Science</option>
            <option>Engineering</option>
            <option>Artificial Intelligence</option>
            <option>UI/UX</option>
            <option>Web Application</option>
            <option>Cyber Security</option>
        </select>

        <label>Year of Study</label>

        <div class="radio-group">
            <label><input type="radio" name="year" value="1st Year" required> 1st Year</label>

            <label><input type="radio" name="year" value="2nd Year"> 2nd Year</label>

            <label><input type="radio" name="year" value="3rd Year"> 3rd Year</label>

            <label><input type="radio" name="year" value="4th Year"> 4th Year</label>
        </div>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="08012345678" required>

        <div class="checkbox">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the above Terms & Conditions</label>
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

    <p id="message"></p>

</div>

<script src="SIF.js"></script>

</body>
</html>
